<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murid · Symphony Course Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="../assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="layout-header"></div>
    <div class="app-shell">
      <div id="layout-sidebar"></div>
      <main class="app-main">
        <div
          class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <h1 class="page-title">Murid</h1>
            <p class="page-subtitle">Kelola data murid les musik</p>
          </div>
          <div class="d-flex gap-2">
            <button
              class="btn btn-outline-secondary"
              id="export-murid-btn"
              data-testid="export-murid-btn"
            >
              <i class="bi bi-download me-1"></i> Ekspor CSV
            </button>
            <button
              class="btn btn-primary"
              id="add-murid-btn"
              data-testid="add-murid-btn"
            >
              <i class="bi bi-plus-lg me-1"></i> Tambah Murid
            </button>
          </div>
        </div>

        <div id="config-warning"></div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="toolbar">
              <div class="input-group" style="max-width: 280px">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  type="text"
                  class="form-control"
                  id="search-murid"
                  placeholder="Cari nama..."
                  data-testid="search-murid-input"
                />
              </div>
              <select
                class="form-select"
                id="filter-instrumen"
                data-testid="filter-instrumen"
              >
                <option value="">Semua Instrumen</option>
                <option>Piano</option>
                <option>Keyboard</option>
                <option>Guitar</option>
                <option>Violin</option>
                <option>Lainnya</option>
              </select>
              <select
                class="form-select"
                id="filter-status"
                data-testid="filter-status"
              >
                <option value="">Semua Status</option>
                <option>Aktif</option>
                <option>Tidak Aktif</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama</th>
                  <th>Instrumen</th>
                  <th>Paket</th>
                  <th>Progress</th>
                  <th>Status</th>
                  <th class="text-end">Aksi</th>
                </tr>
              </thead>
              <tbody id="murid-tbody" data-testid="murid-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Form Murid -->
    <div class="modal fade" id="murid-modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="murid-form" data-testid="murid-form">
            <div class="modal-header">
              <h5 class="modal-title" id="murid-modal-title">Tambah Murid</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="murid-id" />
              <div class="mb-3">
                <label class="form-label" for="murid-nama"
                  >Nama <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="murid-nama"
                  required
                  data-testid="murid-nama-input"
                />
              </div>
              <div class="mb-3">
                <label class="form-label" for="murid-hp">Nomor HP</label>
                <input
                  type="text"
                  class="form-control"
                  id="murid-hp"
                  inputmode="numeric"
                  data-testid="murid-hp-input"
                />
              </div>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label" for="murid-instrumen"
                    >Instrumen</label
                  >
                  <select
                    class="form-select"
                    id="murid-instrumen"
                    data-testid="murid-instrumen-select"
                  >
                    <option>Piano</option>
                    <option>Keyboard</option>
                    <option selected>Guitar</option>
                    <option>Violin</option>
                    <option>Lainnya</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label" for="murid-paket">Paket</label>
                  <select
                    class="form-select"
                    id="murid-paket"
                    data-testid="murid-paket-select"
                  >
                    <option value="4x">4x</option>
                    <option value="8x" selected>8x</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label" for="murid-total"
                    >Total Pertemuan <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    min="1"
                    class="form-control"
                    id="murid-total"
                    value="8"
                    required
                    data-testid="murid-total-input"
                  />
                </div>
                <div class="col-6">
                  <label class="form-label" for="murid-status">Status</label>
                  <select
                    class="form-select"
                    id="murid-status"
                    data-testid="murid-status-select"
                  >
                    <option>Aktif</option>
                    <option>Tidak Aktif</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="murid-submit-btn"
                data-testid="murid-submit-btn"
              >
                Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Detail Murid -->
    <div class="modal fade" id="detail-modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="bi bi-person-badge me-2"></i>Detail Murid
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div
            class="modal-body"
            id="detail-body"
            data-testid="detail-body"
          ></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/murid.js"></script>
  </body>
</html>
