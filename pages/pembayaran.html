<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran · Symphony Course Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="../assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="layout-header"></div>
    <div class="app-shell">
      <div id="layout-sidebar"></div>
      <main class="app-main">
        <div
          class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <h1 class="page-title">Pembayaran</h1>
            <p class="page-subtitle">Kelola pembayaran paket les murid</p>
          </div>
          <div class="d-flex gap-2">
            <button
              class="btn btn-outline-secondary"
              id="export-pembayaran-btn"
              data-testid="export-pembayaran-btn"
            >
              <i class="bi bi-download me-1"></i> Ekspor CSV
            </button>
            <button
              class="btn btn-primary"
              id="add-pembayaran-btn"
              data-testid="add-pembayaran-btn"
            >
              <i class="bi bi-plus-lg me-1"></i> Catat Pembayaran
            </button>
          </div>
        </div>

        <div id="config-warning"></div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="toolbar">
              <div class="input-group" style="max-width: 280px">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  type="text"
                  class="form-control"
                  id="search-pembayaran"
                  placeholder="Cari murid..."
                  data-testid="search-pembayaran-input"
                />
              </div>
              <input
                type="date"
                class="form-control"
                id="filter-tanggal"
                data-testid="filter-tanggal-pembayaran"
                style="max-width: 200px"
              />
              <select
                class="form-select"
                id="filter-status"
                data-testid="filter-status-pembayaran"
              >
                <option value="">Semua Status</option>
                <option>Lunas</option>
                <option>Belum Lunas</option>
              </select>
              <button
                class="btn btn-outline-secondary"
                id="clear-filter-btn"
                data-testid="clear-filter-pembayaran"
              >
                Reset
              </button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Murid</th>
                  <th>Paket</th>
                  <th>Jumlah</th>
                  <th>Metode</th>
                  <th>Status</th>
                  <th class="text-end">Aksi</th>
                </tr>
              </thead>
              <tbody
                id="pembayaran-tbody"
                data-testid="pembayaran-tbody"
              ></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Form Pembayaran -->
    <div class="modal fade" id="pembayaran-modal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="pembayaran-form" data-testid="pembayaran-form">
            <div class="modal-header">
              <h5 class="modal-title" id="pembayaran-modal-title">
                Catat Pembayaran
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="pembayaran-id" />
              <div class="mb-3">
                <label class="form-label" for="pembayaran-murid"
                  >Murid <span class="text-danger">*</span></label
                >
                <select
                  class="form-select"
                  id="pembayaran-murid"
                  required
                  data-testid="pembayaran-murid-select"
                ></select>
              </div>
              <div class="row g-3">
                <div class="col-7">
                  <label class="form-label" for="pembayaran-tanggal"
                    >Tanggal <span class="text-danger">*</span></label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="pembayaran-tanggal"
                    required
                    data-testid="pembayaran-tanggal-input"
                  />
                </div>
                <div class="col-5">
                  <label class="form-label" for="pembayaran-paket">Paket</label>
                  <select
                    class="form-select"
                    id="pembayaran-paket"
                    data-testid="pembayaran-paket-select"
                  >
                    <option value="4x">4x</option>
                    <option value="8x">8x</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="pembayaran-jumlah"
                    >Jumlah (Rp) <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    min="0"
                    class="form-control"
                    id="pembayaran-jumlah"
                    required
                    data-testid="pembayaran-jumlah-input"
                  />
                </div>
                <div class="col-6">
                  <label class="form-label" for="pembayaran-metode"
                    >Metode</label
                  >
                  <select
                    class="form-select"
                    id="pembayaran-metode"
                    data-testid="pembayaran-metode-select"
                  >
                    <option>Cash</option>
                    <option>Transfer</option>
                    <option>QRIS</option>
                    <option>Lainnya</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label" for="pembayaran-status"
                    >Status</label
                  >
                  <select
                    class="form-select"
                    id="pembayaran-status"
                    data-testid="pembayaran-status-select"
                  >
                    <option>Lunas</option>
                    <option>Belum Lunas</option>
                  </select>
                </div>
              </div>
              <div class="mt-3">
                <label class="form-label" for="pembayaran-catatan"
                  >Catatan</label
                >
                <textarea
                  class="form-control"
                  id="pembayaran-catatan"
                  rows="2"
                  data-testid="pembayaran-catatan-input"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="pembayaran-submit-btn"
                data-testid="pembayaran-submit-btn"
              >
                Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pembayaran.js"></script>
  </body>
</html>
