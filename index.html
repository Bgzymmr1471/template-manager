<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Symphony Course Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="layout-header"></div>
    <div class="app-shell">
      <div id="layout-sidebar"></div>
      <main class="app-main">
        <div
          class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Ringkasan aktivitas les musik Anda</p>
          </div>
          <button
            class="btn btn-outline-secondary btn-sm"
            id="refresh-btn"
            data-testid="dashboard-refresh-btn"
          >
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
          </button>
        </div>

        <div id="config-warning"></div>

        <!-- Stat cards -->
        <div class="row g-3 mb-4" data-testid="dashboard-stats">
          <div class="col-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon"><i class="bi bi-people"></i></div>
              <div>
                <div
                  class="stat-value"
                  id="stat-murid"
                  data-testid="stat-total-murid"
                >
                  –
                </div>
                <div class="stat-label">
                  Total Murid
                  <span id="stat-murid-aktif" class="text-muted"></span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon dark">
                <i class="bi bi-calendar-check"></i>
              </div>
              <div>
                <div
                  class="stat-value"
                  id="stat-pertemuan"
                  data-testid="stat-total-pertemuan"
                >
                  –
                </div>
                <div class="stat-label">Pertemuan Bulan Ini</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon green"><i class="bi bi-cash-coin"></i></div>
              <div>
                <div
                  class="stat-value"
                  id="stat-pembayaran"
                  data-testid="stat-total-pembayaran"
                  style="font-size: 1.25rem"
                >
                  –
                </div>
                <div class="stat-label">Pembayaran Bulan Ini</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card stat-card">
              <div class="stat-icon warn">
                <i class="bi bi-hourglass-split"></i>
              </div>
              <div>
                <div
                  class="stat-value"
                  id="stat-hampir-habis"
                  data-testid="stat-hampir-habis"
                >
                  –
                </div>
                <div class="stat-label">Paket Hampir Habis</div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <!-- Grafik pendapatan -->
          <div class="col-12">
            <div class="card">
              <div
                class="card-header d-flex justify-content-between align-items-center"
              >
                <span
                  ><i class="bi bi-graph-up-arrow me-2"></i>Pendapatan 6 Bulan
                  Terakhir</span
                >
                <span
                  class="text-muted small"
                  id="chart-total"
                  data-testid="chart-total"
                ></span>
              </div>
              <div class="card-body">
                <canvas
                  id="income-chart"
                  height="90"
                  data-testid="income-chart"
                ></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3 mt-1">
          <!-- Pertemuan terbaru -->
          <div class="col-12 col-lg-7">
            <div class="card h-100">
              <div class="card-header">
                <i class="bi bi-clock-history me-2"></i>Pertemuan Terbaru
              </div>
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead>
                    <tr>
                      <th>Tanggal</th>
                      <th>Murid</th>
                      <th>Ke-</th>
                      <th>Materi</th>
                    </tr>
                  </thead>
                  <tbody
                    id="recent-pertemuan"
                    data-testid="recent-pertemuan-body"
                  ></tbody>
                </table>
              </div>
            </div>
          </div>
          <!-- Paket hampir habis -->
          <div class="col-12 col-lg-5">
            <div class="card h-100">
              <div class="card-header">
                <i class="bi bi-exclamation-circle me-2"></i>Paket Hampir Habis
              </div>
              <div class="card-body p-0">
                <ul
                  class="list-group list-group-flush"
                  id="hampir-habis-list"
                  data-testid="hampir-habis-list"
                ></ul>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
